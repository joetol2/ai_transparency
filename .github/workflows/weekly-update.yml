name: Weekly AI Governance Update

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Run weekly update agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u +"%B %-d, %Y")
          sed "s/{{TODAY}}/$TODAY/g" .github/prompts/weekly-update.md | claude --print --allowedTools "Bash,Read,Edit,Write,WebSearch,WebFetch,Glob,Grep"

      - name: Trigger Pages deploy
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/static.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Send completion notification
        if: always()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 << 'PYEOF'
          import re, json, os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen

          webhook_url = os.environ['NOTIFY_WEBHOOK_URL']
          status = os.environ['JOB_STATUS']
          run_url = os.environ['RUN_URL']
          today = datetime.now(timezone.utc).strftime('%B %-d, %Y')

          news_lines = []
          if status == 'success':
              try:
                  html = open('index.html').read()

                  lead_match = re.search(r'<p class=["\']lead["\']>(.*?)</p>', html, re.DOTALL)
                  lead = re.sub(r'<[^>]+>', '', lead_match.group(1)).strip() if lead_match else ''
                  if lead:
                      news_lines.append(lead)
                      news_lines.append('')

                  card_blocks = re.findall(r'<div class=["\']card["\']>([\s\S]*?)</div>\s*(?=<div class=["\']card["\']>|</div>)', html)
                  items = []
                  for c in card_blocks[:6]:
                      badge = re.search(r'<span class=["\']badge[^"\']*["\']>([^<]+)</span>', c)
                      h3 = re.search(r'<h3[^>]*>([\s\S]*?)</h3>', c)
                      if not h3:
                          continue
                      badge_t = badge.group(1).strip() if badge else ''
                      h3_t = re.sub(r'<[^>]+>', '', h3.group(1)).strip()
                      ps = re.findall(r'<p(?!\s+class=["\']small["\'])(?:[^>]*)?>([\s\S]*?)</p>', c)
                      body_t = ' '.join(re.sub(r'<[^>]+>', '', p).strip() for p in ps if re.sub(r'<[^>]+>', '', p).strip())
                      items.append(f'[{badge_t}] {h3_t}\n{body_t}')

                  news_lines.extend(items)
              except Exception as e:
                  news_lines.append(f'(Could not extract news content: {e})')

          if news_lines:
              body = f"Weekly AI Governance Hub update completed on {today}.\n\nWHAT'S NEW\n{'='*40}\n\n" + '\n\n'.join(news_lines) + f"\n\n{'='*40}\nView the full hub: https://joetol2.github.io/ai_transparency/\nRun details: {run_url}"
          else:
              body = f"AI Governance Hub weekly workflow completed with status: {status}.\n\nRun details: {run_url}"

          subject = f'AI Governance Hub update: {today} ({status})'
          payload = json.dumps({'to': 'joetol2@gmail.com', 'subject': subject, 'body': body}).encode()
          req = Request(webhook_url, data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              resp = urlopen(req)
              print(f'Notification sent: {resp.read().decode()}')
          except Exception as e:
              print(f'Notification failed: {e}')
          PYEOF
